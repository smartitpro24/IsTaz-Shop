<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Software Update Button</title>

  <style>
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f4f4f4;
      font-family:Arial, sans-serif;
    }

    .update-btn{
      text-decoration:none;
      background:#007bff;
      color:white;
      padding:14px 30px;
      border-radius:10px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .update-btn:hover{
      background:#0056b3;
      transform:scale(1.05);
    }
  </style>
</head>
<body>

  <a href="https://smartitpro24.github.io/IsTaz-Shop-2/" class="update-btn">
    Software Update
  </a>

</body>
</html>
